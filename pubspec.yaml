name: termx
description: "TermX - 跨平台插件化 SSH 终端与 SFTP/服务器监控工具 (Android / iOS / iPadOS / macOS / Windows)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  xterm: ^4.0.0
  dartssh2: ^2.9.0
  crypto: ^3.0.3
  flutter_pty2:
    path: third_party/flutter_pty2
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0
  flutter_secure_storage_windows: ^4.2.2
dependency_overrides:
  flutter_secure_storage_windows:
    path: third_party/flutter_secure_storage_windows
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
